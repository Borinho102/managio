<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Offline | Managio</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    .card { background: #fff; border-radius: 16px; padding: 40px 32px; max-width: 420px; box-shadow: 0 12px 40px rgba(15, 23, 42, .1); }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { margin: 0 0 20px; color: #475569; }
    a { color: #2563eb; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Managio will reconnect automatically. Check your connection, then try again.</p>
    <a href="/">Back to Managio</a>
  </div>
</body>
</html>
